aid: chill
name: Chill
description: >-
  Chill.com is a natural-supplements and wellness marketplace — a Shopify-hosted
  store selling premium supplements, skincare, functional beverages, and healthy
  alternatives aimed at helping people relax, unwind, and beat stress. The store is
  fully agent-native: it publishes an llms.txt agent guide and implements the
  Universal Commerce Protocol (UCP) over a live MCP endpoint, letting AI shopping
  agents search the catalog, build carts, and complete buyer-approved checkout.
  End-user authentication is Shopify Customer Accounts (OAuth 2.0 + OpenID Connect),
  and read-only catalog browsing requires no auth. Surfaced as a 500 Global portfolio
  company and enriched from its public agent-commerce surface.
